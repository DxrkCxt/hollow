# SPDX-License-Identifier: GPL-3.0-only
name: release

# Cut a GitHub Release with prebuilt binaries when a version tag is pushed:
#     git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   name: windows-x64, ext: ".exe" }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, name: linux-x64,   ext: "" }
          - { os: macos-latest,   target: aarch64-apple-darwin,     name: macos-arm64, ext: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --bin hollow --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/hollow${{ matrix.ext }}" \
             "dist/hollow-${{ github.ref_name }}-${{ matrix.name }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: hollow-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    # Publish whatever binaries succeeded — a single flaky platform must not block the
    # whole release. (If every build fails, dist is empty and this job fails too.)
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * | tee SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
