# SPDX-License-Identifier: GPL-3.0-only
name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
            bin: hollow.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            bin: hollow
          # Apple Silicon: macos-latest runners are fast and plentiful, unlike the
          # scarce Intel (macos-13) ones.
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
            bin: hollow
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Test
        run: cargo test --workspace --target ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --bin hollow --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: hollow-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error
