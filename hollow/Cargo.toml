[package]
name = "hollow"
description = "Hollow — a lightweight Minecraft limbo server written in Rust (umbrella crate + binary)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
io-uring = ["hollow-server/io-uring"]

[lib]
name = "hollow"
path = "src/lib.rs"

[[bin]]
name = "hollow"
path = "src/main.rs"

[dependencies]
hollow-protocol.workspace = true
hollow-text.workspace = true
hollow-data.workspace = true
hollow-world.workspace = true
hollow-server.workspace = true
tokio.workspace = true

[dev-dependencies]
bytes.workspace = true
tokio.workspace = true
uuid.workspace = true
time.workspace = true
