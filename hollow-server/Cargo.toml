[package]
name = "hollow-server"
description = "Hollow — server runtime: packets, connection pipeline, accept loop, configuration, console commands, info forwarding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# Real io_uring backend on Linux via tokio-uring (optional). When not enabled,
# IO_URING transport behaves as "not available" and falls back to NIO.
io-uring = ["hollow-data/io-uring"]

[dependencies]
hollow-protocol.workspace = true
hollow-text.workspace = true
hollow-data.workspace = true
hollow-world.workspace = true

bytes.workspace = true
crab_nbt.workspace = true
hmac.workspace = true
md-5.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
sha2.workspace = true
sysinfo.workspace = true
time.workspace = true
tokio.workspace = true
uuid.workspace = true
